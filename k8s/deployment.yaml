apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 6767
        runAsGroup: 6767
        fsGroup: 6767
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model-download
          image: vllm-downloader:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: inference-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: hf-token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: model
              mountPath: /models
            - name: temp
              mountPath: /tmp
      containers:
        - name: vllm
          image: vllm-cpu-private:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: inference-config
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-secrets
                  key: api-token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 5Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: model
              mountPath: /models
              readOnly: true
            - name: temp
              mountPath: /tmp
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: inference-model
        - name: temp
          emptyDir: {}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
